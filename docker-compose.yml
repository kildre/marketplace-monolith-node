version: '3.7'

networks:
  app-network:
    driver: bridge

services:
  postgres:
    container_name: postgres
    image: postgres
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_PORT=5432
      - POSTGRES_DB=node-example-db
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -d node-example-db -U postgres' ]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    container_name: redis
    image: redis
    restart: always
    ports:
      - "6379:6379"
    expose:
      - "6379"
    networks:
      - app-network
