networks:
  app-network:
    driver: bridge

volumes:
  pgdata:

services:
  app:
    container_name: advana-marketplace-monolith-node
    build:
      context: .
      dockerfile: Dockerfile.local
    restart: always
    environment:
      # Prefer a single URL env
      SECRET_ENV_POSTGRESQL: postgres://postgres:password@postgres:5432/advana-marketplace-monolith-db
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks:
      - app-network
  postgres:
    container_name: postgres
    image: postgres
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_PORT=5432
      - POSTGRES_DB=advana-marketplace-monolith-db
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -d advana-marketplace-monolith-db -U postgres",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  # One-off container that runs migrations and exits
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: cli                     # <-- IMPORTANT: has devDeps
    working_dir: /app                 # <-- so .sequelizerc is used
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Your config reads this URL (it sets SEQUELIZE_URL internally)
      SECRET_ENV_POSTGRESQL: postgres://postgres:password@postgres:5432/advana-marketplace-monolith-db
      DIALECT: postgres
      DB_DIALECT: postgres
      NODE_ENV: development
    command: ["npx","--yes","sequelize-cli","db:migrate"]  # <-- array form, no shell
    networks: [app-network]
    restart: "no"