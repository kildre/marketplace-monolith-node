include:
  - project: promotion/tekton-promotion-gitlab
    # file: routes/dragon-full.yml
    file: routes/terraform-only.yml
    # file: routes/terraform-bundle-only.yml

stages:
  - .pre
  - pipeline-trigger
  - deploy
  - .post

variables:
  HELM_CHART_DIR: "./chart"
  DOCKERFILE_PATH: "./Dockerfile.distroless"
  UPSTREAM_PROJECT_DIR: "."
  HELM_RELEASE_NAME: "advana-marketplace-monolith-node"
  DEPLOY_DEV: "true" # default dev account, 5536, mtt-dev
  DEPLOY_TEST: "false" # lovely bee
  TF_VARS_FILE: "configs/il2-sartorial.tfvars"
  AUTO_APPLY: "false" # default to auto apply
  ENABLE_TF_BUNDLE_WORKFLOW: "false" # set to true for terraform bundle pipeline runs
  TF_DIR: "."

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp docs/*.html public/
    - cp docs/*.yaml public/
  artifacts:
    paths:
      - public
  only:
    - main
