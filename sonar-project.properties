# SonarQube Configuration
# This file matches the pipeline configuration for local testing

# Project identification
sonar.projectKey=tenant-metrostar-advana-marketplace-monolith-node
sonar.projectName=advana-marketplace-monolith-node
sonar.projectVersion=1.0.0

# SonarQube server URL
sonar.host.url=https://sonarqube.cdao.us

# Source code location
sonar.sources=.

# Exclude patterns (adjust as needed)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.js,**/logs/**,**/reports/**

# Test file patterns
sonar.tests=src/test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Source encoding
sonar.sourceEncoding=UTF-8

# TypeScript/JavaScript specific settings
sonar.javascript.lcov.reportPaths=reports/coverage/lcov.info
sonar.typescript.lcov.reportPaths=reports/coverage/lcov.info

# Code coverage
sonar.coverage.exclusions=**/*.test.ts,**/*.test.js,**/*.spec.ts,**/*.spec.js,**/test/**,**/migrations/**

# Analysis cache (matches pipeline setting)
sonar.analysisCache.enabled=false

# SCM (matches pipeline setting)
sonar.scm.disabled=true

# Branch analysis (set dynamically or remove for local testing)
# sonar.branch.name=main

# Additional settings for better analysis
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx
